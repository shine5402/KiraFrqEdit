name: Release

# CD scaffold: version tags build the CLI and GUI binaries on the same
# per-platform compiler matrix as CI and upload them as workflow artifacts.
# Publishing (releases page, installers) is out of scope for now.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl
            exe-suffix: .exe
          - name: macos
            os: macos-latest
            cc: clang
            cxx: clang++
            exe-suffix: ""
          - name: linux-x64
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            exe-suffix: ""
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: cargo build --release
        run: cargo build --release --bins --locked
      # The DirectML runtime must sit beside the Windows binaries in the
      # uploaded artifact, and the license texts that accompany it come along
      # (see third_party/DirectML); one staging directory keeps upload-artifact
      # from splitting the files across archive paths.
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/kirafrqgen-cli${{ matrix.exe-suffix }} dist/
          Copy-Item target/release/kirafrqgen-gui${{ matrix.exe-suffix }} dist/
          if ($env:RUNNER_OS -eq 'Windows') {
            Copy-Item target/release/DirectML.dll dist/
            Copy-Item third_party/DirectML/LICENSE.txt dist/DirectML.LICENSE.txt
            Copy-Item third_party/DirectML/ThirdPartyNotices.txt dist/DirectML.ThirdPartyNotices.txt
          }
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: kirafrqgen-${{ matrix.name }}
          path: dist/*
