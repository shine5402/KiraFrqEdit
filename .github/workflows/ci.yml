name: CI

# One compiler per platform, to save CI time (map Notes): clang-cl on Windows,
# Apple clang on macOS, gcc on Linux. MSVC is expected to keep building too —
# a failure there is a bug — but it is not a CI job.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows (clang-cl)
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl
          - name: macos (apple clang)
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: linux (gcc)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: cargo test
        run: cargo test --workspace --locked
