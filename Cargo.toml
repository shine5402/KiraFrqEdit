[workspace]
resolver = "3"
members = [
    "crates/kira-frq-core",
    "crates/kira-frq-world",
    "crates/kira-frqgen",
    "crates/kira-frqgen-cli",
    "crates/kira-frqgen-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/shine5402/KiraFrqEdit"

[workspace.dependencies]
# Exact pins verified by research (#5, #6); bump deliberately.
hound = "=3.5.1"
rubato = "=5.0.0"
cc = "=1.4.6"

# The mrq sharing flag's local-code-page conversion (#16); WHATWG Shift_JIS and
# GBK cover the corpus-relevant code pages.
encoding_rs = "0.8"

rayon = "1.12"
clap = { version = "4", features = ["derive"] }
# Ctrl-C cancellation for the CLI (#12: exit 130 with a partial summary).
ctrlc = "3"
eframe = "0.36"
# GUI dependencies (#23): native folder picker and Phosphor icons.
rfd = "0.17"
egui-phosphor = "0.14"

kira-frq-core = { path = "crates/kira-frq-core" }
kira-frq-world = { path = "crates/kira-frq-world" }
kira-frqgen = { path = "crates/kira-frqgen" }
