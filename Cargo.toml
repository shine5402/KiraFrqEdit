[workspace]
resolver = "3"
members = [
    "crates/frq-core",
    "crates/frq-world",
    "crates/frqgen",
    "crates/frqgen-cli",
    "crates/frqgen-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/shine5402/KiraFrqEdit"

[workspace.dependencies]
# Exact pins verified by research (#5, #6); bump deliberately.
hound = "=3.5.1"
rubato = "=5.0.0"
cc = "=1.4.6"

# The mrq sharing flag's local-code-page conversion (#16); WHATWG Shift_JIS and
# GBK cover the corpus-relevant code pages.
encoding_rs = "0.8"

rayon = "1.12"
clap = { version = "4", features = ["derive"] }
# Ctrl-C cancellation for the CLI (#12: exit 130 with a partial summary).
ctrlc = "3"
eframe = "0.36"
# GUI dependencies (#23): native folder picker and Phosphor icons.
rfd = "0.17"
egui-phosphor = "0.14"

frq-core = { path = "crates/frq-core" }
frq-world = { path = "crates/frq-world" }
frqgen = { path = "crates/frqgen" }
