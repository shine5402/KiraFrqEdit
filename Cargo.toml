[workspace]
resolver = "3"
members = [
    "crates/kirafrq-formats",
    "crates/kirafrq-audio",
    "crates/kirafrq-world-binding",
    "crates/kirafrq-ml-provider",
    "crates/kirafrq-credits",
    "crates/kirafrqgen-core",
    "crates/kirafrqgen-cli",
    "crates/kirafrqgen-gui",
    # Repository maintenance tasks, not shipped; `cargo xtask`.
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/shine5402/KiraFrqEdit"
# The project license, shared by every crate; `cargo-about` reads it to credit
# the workspace itself in the generated dependency notices.
license = "MIT"

[workspace.dependencies]
# Exact pins verified by research (#5, #6); bump deliberately.
hound = "=3.5.1"
rubato = "=5.0.0"
cc = "=1.4.6"
# RMVPE's log-mel frontend (#57); pairs with the ort pin below.
realfft = "=3.5.0"
# ML provider (#48): ONNX Runtime, statically linked; rustls TLS for the
# build-time archive download (no copy-dylibs, no dylib lookup). Exact pin.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
    "api-27",
] }

# The mrq sharing flag's local-code-page conversion (#16); WHATWG Shift_JIS and
# GBK cover the corpus-relevant code pages.
encoding_rs = "0.8"

rayon = "1.12"
clap = { version = "4", features = ["derive"] }
# Ctrl-C cancellation for the CLI (#12: exit 130 with a partial summary).
ctrlc = "3"
eframe = "0.36"
# GUI dependencies (#23): native folder picker and Phosphor icons.
rfd = "0.17"
egui-phosphor = "0.14"
# Reading the clipboard for the path field's context menu (#32); egui only
# writes to it, and eframe's own arboard copy is not exposed to apps.
arboard = { version = "3", default-features = false }

kirafrq-formats = { path = "crates/kirafrq-formats" }
kirafrq-audio = { path = "crates/kirafrq-audio" }
kirafrq-world-binding = { path = "crates/kirafrq-world-binding" }
kirafrq-ml-provider = { path = "crates/kirafrq-ml-provider" }
kirafrq-credits = { path = "crates/kirafrq-credits" }
kirafrqgen-core = { path = "crates/kirafrqgen-core", default-features = false }
