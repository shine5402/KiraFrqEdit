# cargo-about configuration for the Rust dependency notices rendered into
# CREDITS.md (see `xtask credits`).
accepted = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

# Only crates that end up in a shipped binary: build- and dev-only dependencies
# are not redistributed, and unpublished workspace members (the project itself)
# are not third-party notices.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# The platforms the project ships for; anything pulled in only on others is not
# in the binaries and so is not credited.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
