[package]
name = "kirafrqgen-gui"
description = "KiraFrqGen egui interface"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "kirafrqgen-gui"
path = "src/main.rs"

[features]
# The modern default artifact: the ML tier is compiled in and ONNX Runtime is
# linked statically (#48). `--no-default-features` is the compat build.
default = ["ml"]
ml = ["kirafrqgen-core/ml"]

[dependencies]
kirafrqgen-core = { workspace = true, default-features = false }
eframe.workspace = true
rfd.workspace = true
egui-phosphor.workspace = true
arboard.workspace = true
