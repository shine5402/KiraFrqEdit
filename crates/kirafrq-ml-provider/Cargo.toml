[package]
name = "kirafrq-ml-provider"
description = "ML f0 estimator provider: the model-free resample/grid layer and the RMVPE path over ONNX Runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# The RMVPE model path (ONNX Runtime session, log-mel frontend, decoder). All
# `ort` use is confined to the `rmvpe` module; the model-free half compiles
# and tests with this feature off (#48/#56).
ort = ["dep:ort", "dep:realfft", "dep:sha2"]

[dependencies]
rubato.workspace = true
ort = { workspace = true, optional = true }
realfft = { workspace = true, optional = true }

# DirectML is Windows-only: the Windows ONNX Runtime archive carries it, and
# the Linux/macOS archives have no DirectML build at all.
[target.'cfg(windows)'.dependencies]
ort = { workspace = true, optional = true, features = ["directml"] }
# DXGI adapter enumeration for the DirectML device picker: the adapter index
# is the DirectML `device_id`.
windows = { workspace = true, features = ["Win32_Graphics_Dxgi"] }

# Core ML is macOS-only: ONNX Runtime 1.28's prebuilt carries it for
# `aarch64-apple-darwin` alone. `sha2` keys its model cache by content.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, optional = true, features = ["coreml"] }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
# The bundled SwiftF0 model's pinned-commit provenance check (#69).
sha2.workspace = true
# Decoding wavs for the local SwiftF0 parity probe (#69).
kirafrq-audio.workspace = true

[[example]]
name = "mel_probe"
required-features = ["ort"]

[[example]]
name = "swiftf0_probe"
required-features = ["ort"]

[[example]]
name = "runner_probe"
required-features = ["ort"]
